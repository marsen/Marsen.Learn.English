<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聽力測驗（開發版）</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="exam.css">
</head>
<body>
  <main id="app">
    <section id="intro" data-phase="intro">
      <h1>聽力測驗：Section 1（開發版）</h1>
      <p class="note">語音是瀏覽器內建的，只用來測流程，不代表正式音檔品質。錄音只播一次，沒有暫停與倒轉。</p>
      <label>題組 <select id="set-select"></select></label>
      <p><button id="start" type="button" disabled>載入中…</button></p>
      <p id="speech-warning" class="warn" hidden>這個瀏覽器沒有語音合成，無法播放。請改用 Chrome 或 Safari。</p>
    </section>

    <section id="exam" data-phase="exam" hidden>
      <header>
        <h1 id="paper-title"></h1>
        <p id="paper-instruction" class="instruction"></p>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="clock" id="clock" aria-hidden="true"></p>
      </header>
      <form id="paper-form" autocomplete="off"><table id="paper"></table>
        <p><button id="submit" type="submit" disabled>送出</button> <button id="skip" type="button" class="link">略過倒數（開發用）</button></p>
      </form>
    </section>

    <section id="result" data-phase="result" hidden>
      <h1>結果</h1>
      <p id="score" class="score"></p>
      <h2>各題</h2>
      <table id="result-table"></table>
      <h2>各類型答對率</h2>
      <div id="by-type"></div>
      <h2>各陷阱答對率</h2>
      <div id="by-trap"></div>
      <p id="weak" class="note"></p>
      <p><button id="again" type="button">再做一次</button></p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
