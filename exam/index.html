<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聽力測驗（試用版）</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="exam.css">
</head>
<body>
  <main id="app">
    <section id="email" data-phase="email" hidden>
      <h1>作答完成</h1>
      <p>你的答案已經批改好了。留下信箱，我們會寄一封「結果連結」給你；點開連結就能看到分數與每題對錯。</p>
      <form id="email-form">
        <label>Email <input id="email-input" type="email" required autocomplete="email"></label>
        <button id="email-send" type="submit">寄結果連結</button>
      </form>
      <p id="email-message" class="note" role="status" hidden></p>
      <p id="dev-link-box" hidden>本機開發才看得到：<a id="dev-link" href="#">直接開結果連結</a></p>
      <p><button id="email-back" type="button" class="link">回到選題組</button></p>
    </section>

    <section id="intro" data-phase="intro" hidden>
      <h1>聽力測驗：Section 1</h1>
      <p class="who" id="who-box" hidden><span id="who"></span> <button id="logout" type="button" class="link">登出</button></p>
      <p class="note">錄音只播一次，沒有暫停與倒轉。請戴耳機，在安靜的地方作答。做完留下信箱，我們會寄結果連結給你。</p>
      <label>題組 <select id="set-select"></select></label>
      <p><button id="start" type="button" disabled>開始</button> <button id="to-feedback" type="button" class="link" hidden>給回饋</button></p>
      <p id="load-warning" class="warn" hidden></p>
    </section>

    <section id="exam" data-phase="exam" hidden>
      <p id="status" role="status" aria-live="polite" class="status"></p>
      <p class="clock" id="clock" aria-hidden="true"></p>
      <form id="paper-form" autocomplete="off">
        <article class="paper">
          <h1 id="paper-title" class="paper-title"></h1>
          <p id="paper-instruction" class="instruction"></p>
          <div id="paper"></div>
        </article>
        <p class="actions"><button id="submit" type="submit" disabled>送出</button> <button id="skip" type="button" class="link">略過倒數（開發用）</button></p>
      </form>
    </section>

    <section id="result" data-phase="result" hidden>
      <h1>結果</h1>
      <p id="score" class="score"></p>
      <table id="result-table"></table>
      <p id="next-note" class="note" hidden></p>
      <p><button id="next-set" type="button" hidden></button> <button id="result-feedback" type="button">給回饋</button> <button id="again" type="button" class="link">回到選題組</button></p>
    </section>

    <section id="feedback" data-phase="feedback" hidden>
      <h1>給回饋</h1>
      <form id="feedback-form">
        <p>整體感覺（1 差到 5 很好）
          <span class="rating">
            <label><input type="radio" name="rating" value="1">1</label>
            <label><input type="radio" name="rating" value="2">2</label>
            <label><input type="radio" name="rating" value="3">3</label>
            <label><input type="radio" name="rating" value="4">4</label>
            <label><input type="radio" name="rating" value="5">5</label>
          </span>
        </p>
        <p>錄音聽得清楚嗎？
          <label><input type="radio" name="audio_ok" value="yes">清楚</label>
          <label><input type="radio" name="audio_ok" value="no">不清楚（拼字、數字、口音、速度…）</label>
        </p>
        <p><label>想說的話<br><textarea id="feedback-message" rows="5" maxlength="2000"></textarea></label></p>
        <p><button id="feedback-send" type="submit">送出</button> <button id="feedback-cancel" type="button" class="link">不用了，回去</button></p>
        <p id="feedback-message-status" class="note" role="status" hidden></p>
      </form>
    </section>
    <footer id="contact" class="note" hidden></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
